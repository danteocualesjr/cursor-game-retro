<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codequest: Hoot's Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="title-block">
          <div class="title">CODEQUEST</div>
          <div
            id="tutorBadge"
            class="tutor-badge tutor-badge-unknown"
            title="Checking AI tutor status..."
            aria-live="polite"
          >
            <span class="tutor-badge-dot" aria-hidden="true"></span>
            <span class="tutor-badge-text">checking</span>
          </div>
        </div>
        <div class="subtitle">Hoot the Owl needs your code!</div>
        <div class="level-pills" id="levelPills"></div>
      </header>

      <main class="stage">
        <section class="game-pane" aria-label="Game world">
          <canvas
            id="game"
            width="512"
            height="384"
            role="img"
            aria-label="Pixel-art puzzle grid showing the hero, gems, crates, and obstacles."
          ></canvas>
          <div class="hud">
            <div class="objective" id="objective" aria-live="polite">Loading...</div>
            <div class="hud-side">
              <div class="steps" id="steps" title="Hero actions used so far" aria-label="Steps taken">
                <span class="steps-label" aria-hidden="true">STEPS</span>
                <span class="steps-value" id="stepsValue">0</span>
              </div>
              <div
                class="status"
                id="status"
                role="status"
                aria-live="polite"
                aria-atomic="true"
              ></div>
            </div>
          </div>
          <div class="hoot" id="hoot" hidden aria-live="polite">
            <div class="hoot-bubble" id="hootBubble"></div>
            <div class="hoot-sprite" aria-hidden="true">
              <span class="hoot-eye left"></span>
              <span class="hoot-eye right"></span>
              <span class="hoot-beak"></span>
            </div>
          </div>
        </section>

        <section class="code-pane" aria-label="Code editor and controls">
          <div class="code-header">
            <span class="cmds-label" aria-hidden="true">Available commands:</span>
            <span class="cmds-list" id="cmdsList" aria-label="Commands available on this level"></span>
          </div>
          <div id="editor" class="editor" aria-label="Code editor (Ctrl+Enter to run)"></div>
          <div class="controls">
            <button id="runBtn" class="btn btn-primary" aria-keyshortcuts="Control+Enter Meta+Enter">RUN</button>
            <button id="resetBtn" class="btn">RESET</button>
            <button id="hintBtn" class="btn btn-hint">HINT</button>
            <button
              id="speedBtn"
              class="btn btn-speed"
              aria-label="Cycle animation speed"
              title="Cycle animation speed (1x / 2x / 4x)"
            >1x</button>
            <button id="muteBtn" class="btn btn-mute" aria-label="Toggle sound" aria-pressed="false">SOUND ON</button>
          </div>
        </section>
      </main>

      <footer class="footer">
        Built with Cursor SDK. Code carefully, brave hero.
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
