name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow re-running from the Actions tab.
  workflow_dispatch:

# Cancel any in-flight run for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm test
